<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Preposition for Kids</title>
    <style>
        html, body {
            <h1> <B> CLICK THE BUTTON TO PLAY </B></H1>
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #FFFFFF; /* Light Alice Blue background */
            overflow: hidden; 
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #flash-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The starting overlay that instructs the user to play */
        #play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #09a1ed;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #play-button {
            padding: 20px 40px;
            font-size: 26px;
            font-weight: bold;
            color: white;
            background-color: #4CAF50; /* Friendly green button */
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.2s;
        }

        #play-button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        /* Smaller fullscreen toggle button for later */
        #fs-button {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 8px 12px;
            background-color: #ffffff;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            display: none; /* Hidden until they click play */
        }
    </style>
    <!-- Load the Ruffle emulator -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <!-- Initial Play Screen -->
    <div id="play-overlay">
        <button id="play-button" onclick="startApp()">Click Here to Play!</button>
    </div>

    <!-- Fullscreen Toggle (Hidden initially) -->
    <button id="fs-button" onclick="toggleFullScreen()">Exit Fullscreen</button>

    <!-- App Container -->
    <div id="flash-container"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            letterbox: "on",
            backgroundColor: "#f0f8ff", // Ensures the Flash background matches the webpage
            autoplay: "on"
        };

        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("flash-container");
            container.appendChild(player);
            
            // Load your correctly named SWF file
            player.load("preposition_app.swf"); 
        });

        function startApp() {
            // Hide the startup overlay
            document.getElementById('play-overlay').style.display = 'none';
            // Show the standard fullscreen toggle button
            document.getElementById('fs-button').style.display = 'block';
            
            // Trigger fullscreen mode automatically on mobile and PC
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen();
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen();
            } else if (docEl.msRequestFullscreen) {
                docEl.msRequestFullscreen();
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {  
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
                document.getElementById('fs-button').innerText = "Exit Fullscreen";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                document.getElementById('fs-button').innerText = "Go Fullscreen";
            }
        }
    </script>

</body>
</html>
