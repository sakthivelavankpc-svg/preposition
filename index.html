<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Preposition for Kids</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f0f8ff; 
            overflow: hidden; 
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Exactly 100% of the screen width and height */
        #flash-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* FIX: Prevents mobile URL bar from cutting off the app */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Forces the Flash emulator to stretch to the container's edges */
        ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }

        #play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f0f8ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #play-button {
            padding: 20px 40px;
            font-size: 26px;
            font-weight: bold;
            color: white;
            background-color: #4CAF50; 
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.2s;
        }

        #play-button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        #fs-button {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 8px 12px;
            background-color: #ffffff;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            display: none; 
        }
    </style>
    <!-- Load the Ruffle emulator -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <!-- Initial Play Screen -->
    <div id="play-overlay">
        <button id="play-button" onclick="startApp()">Click Here to Play!</button>
    </div>

    <!-- Fullscreen Toggle -->
    <button id="fs-button" onclick="toggleFullScreen()">Exit Fullscreen</button>

    <!-- App Container -->
    <div id="flash-container"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            letterbox: "on",
            backgroundColor: "#f0f8ff", 
            autoplay: "on",
            unmuteOverlay: "hidden" // FIX: Prevents Ruffle from showing a second invisible play button
        };

        // Initialize a global variable for the player
        let player = null;

        function startApp() {
            document.getElementById('play-overlay').style.display = 'none';
            document.getElementById('fs-button').style.display = 'block';
            
            // FIX: Initialize and load the SWF inside the click event.
            // Mobile browsers require a physical tap to allow audio and autoplay.
            if (!player) {
                const ruffle = window.RufflePlayer.newest();
                player = ruffle.createPlayer();
                const container = document.getElementById("flash-container");
                container.appendChild(player);
                
                // Matches your renamed file on GitHub Pages
                player.load("preposition_app.swf"); 
            }

            const docEl = document.documentElement;
            
            // FIX: Safely attempt fullscreen. iPhones do not support this and will crash if not caught.
            try {
                if (docEl.requestFullscreen) {
                    const promise = docEl.requestFullscreen();
                    if (promise) promise.catch(err => console.warn("Fullscreen ignored by mobile browser"));
                } else if (docEl.webkitRequestFullscreen) {
                    docEl.webkitRequestFullscreen();
                } else if (docEl.msRequestFullscreen) {
                    docEl.msRequestFullscreen();
                }
            } catch (err) {
                console.warn("Fullscreen API not supported on this device.");
            }
        }

        function toggleFullScreen() {
            try {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {  
                    if (document.documentElement.requestFullscreen) {
                        const promise = document.documentElement.requestFullscreen();
                        if (promise) promise.catch(e => console.warn(e));
                    } else if (document.documentElement.webkitRequestFullscreen) {
                        document.documentElement.webkitRequestFullscreen();
                    }
                    document.getElementById('fs-button').innerText = "Exit Fullscreen";
                } else {
                    if (document.exitFullscreen) {
                        const promise = document.exitFullscreen();
                        if (promise) promise.catch(e => console.warn(e));
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                    document.getElementById('fs-button').innerText = "Go Fullscreen";
                }
            } catch (err) {
                console.warn("Fullscreen toggle failed or unsupported.");
            }
        }
    </script>

</body>
</html>
