<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This meta tag is crucial for mobile. It prevents pinch-zooming and sets the correct scale -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Preposition for Kids</title>
    <style>
        /* Remove all default browser margins and prevent scrolling */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Black background looks best for fullscreen */
            overflow: hidden; 
            touch-action: none; /* Prevents mobile swipe-to-refresh or zooming */
        }

        /* Make the container stretch to the full width and height of the screen */
        #flash-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Style for the fullscreen button */
        #fs-button {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 10px 15px;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            font-family: sans-serif;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000; /* Ensures the button stays on top of the animation */
            transition: background-color 0.3s;
        }

        #fs-button:hover {
            background-color: rgba(255, 255, 255, 0.5);
        }
    </style>
    <!-- Load the Ruffle emulator -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <!-- Fullscreen Button -->
    <button id="fs-button" onclick="toggleFullScreen()">Go Fullscreen</button>

    <!-- App Container -->
    <div id="flash-container"></div>

    <script>
        // Ruffle Configuration
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            // "showAll" ensures the app scales up as much as possible without cropping
            letterbox: "on",
            backgroundColor: "#000000"
        };

        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("flash-container");
            container.appendChild(player);
            
            // Load your correctly named SWF file
            player.load("preposition_app.swf"); 
        });

        // Function to handle the Fullscreen button
        function toggleFullScreen() {
            if (!document.fullscreenElement &&    // standard
                !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement ) {  // vendor prefixes
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                } else if (document.documentElement.mozRequestFullScreen) {
                    document.documentElement.mozRequestFullScreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
                }
                document.getElementById('fs-button').innerText = "Exit Fullscreen";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                document.getElementById('fs-button').innerText = "Go Fullscreen";
            }
        }
    </script>

</body>
</html>
